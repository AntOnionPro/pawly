name: Auto-asignar issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  assign-author:
    name: Asignar al creador
    if: toJSON(github.event.issue.assignees) == '[]' && github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Asignar el issue a quien lo creó
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          gh issue edit "$ISSUE" --add-assignee "$AUTHOR" \
            || echo "::notice::No se pudo asignar a $AUTHOR (¿no es colaborador del repositorio?). Asígnalo manualmente."
