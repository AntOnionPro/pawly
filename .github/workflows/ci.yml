name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar YAML (yamllint)
        run: pipx run --spec 'yamllint==1.35.1' yamllint --strict .

      - name: Validar workflows (actionlint)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

      - name: Validar plantillas de issue y etiquetas
        run: |
          status=0
          for f in .github/ISSUE_TEMPLATE/*.yml; do
            [ "$(basename "$f")" = "config.yml" ] && continue
            if ! yq -e '.name and .description and .body' "$f" > /dev/null; then
              echo "::error file=$f::La plantilla debe definir name, description y body."
              status=1
            fi
            while IFS= read -r label; do
              [ -z "$label" ] && continue
              if ! LABEL="$label" yq -e '.[] | select(.name == strenv(LABEL))' .github/labels.yml > /dev/null; then
                echo "::error file=$f::La etiqueta '$label' no está definida en .github/labels.yml."
                status=1
              fi
            done < <(yq '.labels[]' "$f")
          done
          exit "$status"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias de la app
        working-directory: mobile
        run: npm ci

      - name: Lint de la app (ESLint)
        working-directory: mobile
        run: npm run lint

      - name: Formato de la app (Prettier)
        working-directory: mobile
        run: npm run format:check

      - name: Tipos de la app (TypeScript)
        working-directory: mobile
        run: npm run typecheck

  tests:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias de la app
        run: npm ci

      - name: Pruebas de la app (Jest)
        run: npm test -- --ci

      - name: Compilar la app para Android, iOS y web
        run: npx expo export --platform android --platform ios --platform web --output-dir "$RUNNER_TEMP/expo-export"
